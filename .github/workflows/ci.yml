name: CI

# Wajib hijau sebelum merge (AGENTS.md §10). Merge ke main dilakukan pemilik proyek setelah persetujuan.
on:
  pull_request:
  push:
    branches: [main, "tahap-*", "claude/**"]
  workflow_dispatch: # dapat dijalankan manual pada commit/branch mana pun (bukti CI untuk audit, G1-A03)

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · Typecheck · Guard · Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 } # gitleaks memindai riwayat
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Konteks Docker (pemeriksaan tipe `next build` tanpa tests/ — mencegah build image gagal di server)
        run: npm run check:docker-context
      - name: Guard nomor operasional (Admisi/Hotline tidak boleh muncul di non-production)
        run: npm run guard:operational
        env:
          # Opsional: sha256 digit E.164 nomor operasional (secret CI; bukan di repository).
          OPERATIONAL_NUMBER_HASHES: ${{ secrets.OPERATIONAL_NUMBER_HASHES }}
      - name: Secret scan (lokal)
        run: npm run scan:secrets
      - name: Secret scan (gitleaks, seluruh riwayat git)
        # Biner di-pin dengan checksum resmi rilis. Tidak memakai gitleaks-action: pada event push ia menghitung rentang
        # "<commit-pertama>^..HEAD", yang gagal untuk repository yang riwayatnya diawali root commit (terjadi pada run #1).
        env:
          GITLEAKS_VERSION: "8.24.3"
          GITLEAKS_SHA256: "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c"
        run: |
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum --check --strict
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks detect --source . --redact --no-banner --exit-code 2 --verbose
          rm -f gitleaks gitleaks.tgz
      - name: Audit dependensi produksi
        run: npm audit --omit=dev --audit-level=high

  test:
    name: Build · Test regresi · E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres # database uji sekali pakai di runner CI; bukan rahasia
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_ADMIN_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres # secret-scan:allow — DB uji sekali pakai di runner CI
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Test regresi (@tahap-1 … tahap berjalan) — migrasi diuji pada database kosong
        # `npm run test:report` = scripts/run-test-report.mjs: exit code Vitest DITERUSKAN (G1-A01) + penjaga hasil (suite gagal, hasil hilang/usang/rusak).
        run: npm run test:report
      - name: Pasang Chromium untuk E2E
        run: npx playwright install --with-deps chromium
      - name: Golden E2E (G1 + G2 SIMULASI; G2-nyata dan G3–G8 placeholder bertanda BELUM TERSEDIA)
        run: npm run e2e
      - name: Ringkasan test per tag + penjaga baseline (jumlah test tidak boleh turun)
        if: always()
        run: |
          node scripts/test-tag-report.mjs --require-e2e | tee -a "$GITHUB_STEP_SUMMARY"; exit "${PIPESTATUS[0]}"
      - name: Unggah laporan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laporan-test
          path: |
            .test-results/tag-report.md
            .test-results/vitest.json
            .test-results/vitest-exit.json
            .test-results/playwright.json
          retention-days: 30

  backup-restore:
    name: Drill backup & restore nyata
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_ADMIN_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres # secret-scan:allow — DB uji sekali pakai di runner CI
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client-16 || sudo apt-get install -y postgresql-client
      - run: bash scripts/backup-restore-drill.sh

  image:
    name: Image Docker (build · migrasi · jalan · provenance)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres } # database uji sekali pakai di runner CI; bukan rahasia
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Build image runtime + tools (konteks bersih; .dockerignore berlaku)
        run: |
          docker build --build-arg "GIT_SHA=${GITHUB_SHA}" -t teone-app:ci .
          docker build --target tools --build-arg "GIT_SHA=${GITHUB_SHA}" -t teone-tools:ci .
      - name: Provenance & isi image (label = commit; tanpa tests/; non-root)
        run: |
          for img in teone-app:ci teone-tools:ci; do
            rev="$(docker image inspect "$img" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
            echo "$img revision=$rev id=$(docker image inspect "$img" --format '{{.Id}}')"
            test "$rev" = "$GITHUB_SHA"
          done
          docker run --rm --entrypoint sh teone-app:ci -c 'test ! -e /app/tests && test ! -e /app/playwright.config.ts && test ! -e /app/docs && test "$(id -u)" = 10001 && ls -ld /data/media'
      - name: Validasi Caddyfile dan Compose staging
        run: |
          docker run --rm -e SITE_ADDRESS=staging-chat.example.invalid -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2 caddy validate --config /etc/caddy/Caddyfile
          sudo mkdir -p /etc/teone && sudo touch /etc/teone/staging.env /etc/teone/pg_superuser.secret
          TEONE_TAG=ci SITE_ADDRESS=staging-chat.example.invalid docker compose -f deploy/docker-compose.staging.yml config -q
      - name: Migrasi dari DALAM image tools, lalu jalankan image app dan periksa health + header
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null
          OWNER_PW="$(openssl rand -hex 12)"; APP_PW="$(openssl rand -hex 12)"; KEY="$(openssl rand -base64 32)"
          echo "::add-mask::$OWNER_PW"; echo "::add-mask::$APP_PW"; echo "::add-mask::$KEY"
          export PGPASSWORD=postgres
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -c "CREATE ROLE teone_owner LOGIN PASSWORD '$OWNER_PW'" -c "CREATE ROLE teone_app LOGIN PASSWORD '$APP_PW' NOSUPERUSER NOCREATEDB NOCREATEROLE" -c "CREATE DATABASE teone_image OWNER teone_owner"
          psql -h 127.0.0.1 -U postgres -d teone_image -v ON_ERROR_STOP=1 -c "REVOKE CREATE ON SCHEMA public FROM PUBLIC; ALTER SCHEMA public OWNER TO teone_owner; GRANT USAGE ON SCHEMA public TO teone_app;"
          OWNER_URL="postgres://teone_owner:${OWNER_PW}@127.0.0.1:5432/teone_image"; APP_URL="postgres://teone_app:${APP_PW}@127.0.0.1:5432/teone_image"
          ENVS=(-e APP_ENV=staging -e APP_BASE_URL=https://ci.example.invalid -e TRUST_PROXY=false -e "APP_ENCRYPTION_KEY=$KEY" -e "DATABASE_URL=$APP_URL" -e "DATABASE_MIGRATION_URL=$OWNER_URL")
          docker run --rm --network host "${ENVS[@]}" teone-tools:ci npm run db:migrate
          docker run -d --name teone-ci --network host "${ENVS[@]}" teone-app:ci
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:3000/api/health >/tmp/health.json 2>/dev/null && break; sleep 1; done
          cat /tmp/health.json; echo
          test "$(cat /tmp/health.json)" = '{"status":"ok"}'
          curl -sI http://127.0.0.1:3000/login | tee /tmp/headers.txt
          grep -qi '^x-frame-options: DENY' /tmp/headers.txt && ! grep -qi '^x-powered-by' /tmp/headers.txt
          test "$(docker exec teone-ci id -u)" = 10001
          docker logs teone-ci 2>&1 | tail -5
          docker rm -f teone-ci
