# Staging TE One — server TERSENDIRI (bukan VPS HRIS/keuangan). Semua nilai rahasia dari berkas env di server
# (/etc/teone/staging.env, chmod 600, TIDAK di repository). Lihat docs/staging.md.
# STATUS: dibuat; server staging berjalan (dilaporkan operator), BELUM terbukti di repository (docs/staging.md §6). Tahap 2: + service worker dan volume media.
# Nama proyek DIKUNCI `deploy` (S-06/R-2): volume yang sudah ada (deploy_pg_data, deploy_media_data, deploy_caddy_data) tetap dipakai walau compose
# dijalankan dari direktori lain; tanpa ini nama proyek mengikuti nama direktori dan bisa membuat volume KOSONG (database baru).
name: deploy
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_superuser
    secrets: [pg_superuser]
    volumes: [pg_data:/var/lib/postgresql/data]
    networks: [internal]            # tidak dipublikasikan ke host/internet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      retries: 10
  app:
    image: teone-app:${TEONE_TAG:-staging}   # dibangun dari ./Dockerfile oleh scripts/build-staging-image.sh (tag staging-<sha7> = commit)
    restart: unless-stopped
    env_file: /etc/teone/staging.env
    depends_on: { db: { condition: service_healthy } }
    networks: [internal]
    expose: ["3000"]
    environment:
      MEDIA_DIR: /data/media        # media privat (Tahap 2) — volume persisten; HARUS ikut dibackup
    volumes: [media_data:/data/media]
  worker:                           # Tahap 2: pemroses antrean event webhook, rekonsiliasi, unduh media, retensi payload (D-18) — A-4 disetujui 26 Nov 2026
    # Satu-satunya proses yang menjalankan PEMELIHARAAN berkala (runMaintenance: purge payload, penyapu `diproses`, rekonsiliasi, ulang media,
    # fallback outbox). Mode inline di `app` (WORKER_INLINE=true) hanya memproses antrean saat ada webhook (S-10).
    # Env SAMA dengan app (/etc/teone/staging.env + MEDIA_DIR + volume media). Perintah menyalakan: docs/staging.md §5b.
    image: teone-tools:${TEONE_TAG:-staging}   # Aman berdampingan dengan app (SKIP LOCKED + lease)
    restart: unless-stopped
    stop_grace_period: 30s          # worker berhenti setelah batch yang sedang berjalan (SIGTERM)
    user: "10001:10001"             # sama dengan pengguna image runtime agar menulis ke volume media yang sama
    command: ["npm", "run", "worker"]
    env_file: /etc/teone/staging.env
    environment:
      MEDIA_DIR: /data/media
    volumes: [media_data:/data/media]
    depends_on: { db: { condition: service_healthy } }
    networks: [internal]
  tools:                            # tugas sekali-jalan: docker compose run --rm tools npm run db:migrate
    image: teone-tools:${TEONE_TAG:-staging}   # dibangun oleh scripts/build-staging-image.sh (target tools)
    profiles: ["tools"]
    env_file: /etc/teone/staging.env
    depends_on: { db: { condition: service_healthy } }
    networks: [internal]
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]     # satu-satunya yang terbuka ke internet
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-staging-chat.example.invalid}   # dari deploy/.env (non-rahasia); dibaca Caddyfile sebagai {$SITE_ADDRESS}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    networks: [internal]
    depends_on: [app]
networks:
  internal: {}
secrets:
  pg_superuser:
    file: /etc/teone/pg_superuser.secret
volumes:
  pg_data: {}
  caddy_data: {}
  media_data: {}
