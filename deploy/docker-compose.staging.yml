# Staging TE One — server TERSENDIRI (bukan VPS HRIS/keuangan). Semua nilai rahasia dari berkas env di server
# (/etc/teone/staging.env, chmod 600, TIDAK di repository). Lihat docs/staging.md.
# STATUS: dibuat, BELUM diuji pada server staging (Jalur 0 J0-03 belum tersedia).
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_superuser
    secrets: [pg_superuser]
    volumes: [pg_data:/var/lib/postgresql/data]
    networks: [internal]            # tidak dipublikasikan ke host/internet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      retries: 10
  app:
    image: teone-app:staging        # dibangun dari ./Dockerfile
    restart: unless-stopped
    env_file: /etc/teone/staging.env
    depends_on: { db: { condition: service_healthy } }
    networks: [internal]
    expose: ["3000"]
  tools:                            # tugas sekali-jalan: docker compose run --rm tools npm run db:migrate
    image: teone-tools:staging      # dibangun: docker build --target tools -t teone-tools:staging .
    profiles: ["tools"]
    env_file: /etc/teone/staging.env
    depends_on: { db: { condition: service_healthy } }
    networks: [internal]
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]     # satu-satunya yang terbuka ke internet
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    networks: [internal]
    depends_on: [app]
networks:
  internal: {}
secrets:
  pg_superuser:
    file: /etc/teone/pg_superuser.secret
volumes:
  pg_data: {}
  caddy_data: {}
